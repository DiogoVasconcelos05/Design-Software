spring.datasource.url=jdbc:sqlite:data/lisboapedala.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/*/schema.sql
management.endpoints.web.exposure.include=health
lisboapedala.trip.unlock-timeout-seconds=60
lisboapedala.trip.billing-retry-interval-seconds=60
lisboapedala.dock.processed-event-retention-hours=48
lisboapedala.payment.max-attempts=5
lisboapedala.payment.retry-interval-seconds=60
lisboapedala.fleet.battery-max-temperature-celsius=60
